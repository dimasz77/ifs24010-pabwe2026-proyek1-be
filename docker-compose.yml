# Menjalankan backend (API + SQLite persisten):  docker compose up -d --build  ->  http://localhost:4000
services:
  api:
    build: .
    image: rental-motor-samosir-backend:latest
    container_name: rental-motor-samosir-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      AUTO_SEED: "true"
      LATE_FEE_MULTIPLIER: "1.5"
      # Isi dengan URL frontend yang mengakses API ini (pisahkan dengan koma)
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
    volumes:
      - rental_data:/data

volumes:
  rental_data:
